name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    attributes:
      label: Reproduction
      description: Minimal runnable code and exact commands
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      placeholder: OpenMesh version, Node version, operating system
    validations:
      required: true
