name: Benchmark report
description: Share a reproducible independent benchmark or regression
title: "[benchmark] "
labels: ["performance"]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: OpenMesh 0.4.0, Node 24.18.0, comparison version
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware / OS
      placeholder: CPU, logical cores, OS
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true

  - type: textarea
    id: results
    attributes:
      label: Raw results
      description: Prefer per-round data or attach the JSON report. Do not report only the best run.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Workload equivalence / caveats
      description: Note schemas, payloads, TLS, route counts, warmups, background load, or other differences.
