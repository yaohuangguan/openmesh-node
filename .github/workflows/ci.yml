name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:types
      - run: npm run test:package
      - run: npm run demo:cluster
      - run: npm run demo:services
      - run: npm pack --dry-run

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run Redis adapter integration
        env:
          OPENMESH_REDIS_URL: redis://127.0.0.1:6379
        run: node --test tests/redis-adapter.test.cjs

  benchmark-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run normalized benchmark
        run: node benchmarks/run.cjs --duration=2 --rounds=3 --connections=32 --frameworks=openmesh,fastify --scenarios=plaintext,json,params,body,middleware --output=results/ci.json
      - name: Enforce regression budget
        run: npm run bench:guard -- --report=benchmarks/results/ci.json --min-ratio=0.82 --min-geomean=0.88 --max-p99-ratio=3
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-node24-ubuntu
          path: benchmarks/results/ci.json
