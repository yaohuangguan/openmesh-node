name: Cross-runtime mesh benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/mesh/**"
      - "docs/mesh-benchmark.md"
      - "docs/performance.md"
      - "package.json"
      - ".github/workflows/mesh-benchmark.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    services:
      zookeeper:
        image: zookeeper:3.9
        ports:
          - 2181:2181

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Install Dapr runtime 1.18.0
        run: |
          mkdir -p /tmp/dapr-runtime
          curl -fsSL             https://github.com/dapr/dapr/releases/download/v1.18.0/daprd_linux_amd64.tar.gz             -o /tmp/daprd.tar.gz
          tar -xzf /tmp/daprd.tar.gz -C /tmp/dapr-runtime
          chmod +x /tmp/dapr-runtime/daprd
          /tmp/dapr-runtime/daprd --version

      - name: Build Dubbo 3.3.6 benchmark adapter
        run: |
          mvn -q -f benchmarks/mesh/dubbo/pom.xml             package dependency:copy-dependencies             -DincludeScope=runtime
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/2181) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "ZooKeeper did not become ready" >&2
          exit 1

      - name: Pull Envoy 1.39 stable image
        run: docker pull envoyproxy/envoy:v1.39-latest

      - name: Run OpenMesh mesh benchmark
        run: >-
          node benchmarks/mesh/run.cjs
          --duration=2
          --rounds=3
          --connections=32
          --adapter=openmesh
          --output=results/openmesh-ci.json

      - name: Run Envoy C++ sidecar benchmark
        env:
          ENVOY_IMAGE: envoyproxy/envoy:v1.39-latest
          ENVOY_VERSION: "1.39"
        run: >-
          node benchmarks/mesh/run.cjs
          --duration=2
          --rounds=3
          --connections=32
          --adapter=envoy
          --output=results/envoy-ci.json

      - name: Run Apache Dubbo proxyless benchmark
        env:
          DUBBO_VERSION: 3.3.6
          DUBBO_ZOOKEEPER: 127.0.0.1:2181
          DUBBO_CLASSPATH: ${{ github.workspace }}/benchmarks/mesh/dubbo/target/classes:${{ github.workspace }}/benchmarks/mesh/dubbo/target/dependency/*
        run: >-
          node benchmarks/mesh/run.cjs
          --duration=2
          --rounds=3
          --connections=32
          --adapter=dubbo
          --output=results/dubbo-ci.json

      - name: Run Dapr sidecar benchmark
        env:
          DAPR_BIN: /tmp/dapr-runtime/daprd
          DAPR_VERSION: 1.18.0
        run: >-
          node benchmarks/mesh/run.cjs
          --duration=2
          --rounds=3
          --connections=32
          --adapter=dapr
          --output=results/dapr-ci.json

      - name: Create Kubernetes 1.35 + Linkerd 2.20 benchmark topology
        run: |
          chmod +x benchmarks/mesh/linkerd/setup.sh
          benchmarks/mesh/linkerd/setup.sh

      - name: Start Linkerd direct and meshed gateway forwards
        run: |
          kubectl port-forward -n bench-direct svc/gateway 18080:8080 >/tmp/linkerd-direct-portforward.log 2>&1 &
          echo $! > /tmp/linkerd-direct-portforward.pid
          kubectl port-forward -n bench-linkerd svc/gateway 18081:8080 >/tmp/linkerd-mesh-portforward.log 2>&1 &
          echo $! > /tmp/linkerd-mesh-portforward.pid
          for port in 18080 18081; do
            for i in {1..60}; do
              if curl -fsS "http://127.0.0.1:$port/work" >/dev/null; then
                break
              fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/work" >/dev/null
          done

      - name: Run Linkerd 2.20 Rust sidecar benchmark
        env:
          LINKERD_VERSION: "2.20"
          LINKERD_DIRECT_URL: http://127.0.0.1:18080/work
          LINKERD_MESH_URL: http://127.0.0.1:18081/work
          LINKERD_NAMESPACE: bench-linkerd
        run: >-
          node benchmarks/mesh/run.cjs
          --duration=2
          --rounds=3
          --connections=32
          --adapter=linkerd
          --output=results/linkerd-ci.json

      - name: Render same-runner comparison
        run: >-
          node benchmarks/mesh/compare.cjs
          benchmarks/mesh/results/openmesh-ci.json
          benchmarks/mesh/results/dubbo-ci.json
          benchmarks/mesh/results/dapr-ci.json
          benchmarks/mesh/results/envoy-ci.json
          benchmarks/mesh/results/linkerd-ci.json
          --output=benchmarks/mesh/results/comparison.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-runtime-mesh-node24-ubuntu
          path: |
            benchmarks/mesh/results/openmesh-ci.json
            benchmarks/mesh/results/dubbo-ci.json
            benchmarks/mesh/results/dapr-ci.json
            benchmarks/mesh/results/envoy-ci.json
            benchmarks/mesh/results/linkerd-ci.json
            benchmarks/mesh/results/comparison.md
